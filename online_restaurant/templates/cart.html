<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Кошик — Шашличний Рай</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5efe6;
        }

        .navbar {
            background-color: #481515;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        h1 {
            color: #481515;
        }

        .cart-item {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .btn-minus {
            background-color: #d6a84f;
            color: white;
        }

        .btn-plus {
            background-color: #481515;
            color: white;
        }

        .btn-plus:hover {
            background-color: #6b2222;
            color: white;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand" href="/">
            Шашличний Рай
        </a>

        <div>

            <a class="nav-link d-inline-block" href="/">
                Головна
            </a>

            <a class="nav-link d-inline-block" href="/menu">
                Меню
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Ваш кошик
    </h1>

    {% if dishes %}

        {% for item in dishes %}

        <div class="cart-item shadow-sm">

            <div class="row align-items-center">

                <div class="col-md-5">

                    <h4>
                        {{ item.dish.name }}
                    </h4>

                    <p>
                        Ціна: {{ item.dish.price }} €
                    </p>

                </div>

                <div class="col-md-3">

                    <p>
                        Кількість:
                        <b>{{ item.quantity }}</b>
                    </p>

                </div>

                <div class="col-md-4">

                    <a
                        href="/decrease/{{ item.dish.id }}"
                        class="btn btn-minus"
                    >
                        −
                    </a>

                    <a
                        href="/increase/{{ item.dish.id }}"
                        class="btn btn-plus"
                    >
                        +
                    </a>

                    <a
                        href="/remove/{{ item.dish.id }}"
                        class="btn btn-danger"
                    >
                        Видалити
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="text-center">

            <h4>
                Кошик порожній
            </h4>

            <p>
                Додайте щось смачне з нашого меню!
            </p>

        </div>

    {% endif %}

    <div class="text-center mt-4">

        <a
            href="/menu"
            class="btn btn-secondary"
        >
            Повернутися до меню
        </a>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмін-панель</title>

    <style>

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5efe6;
        }

        header{
            background:#481515;
            color:white;
            padding:20px;
            text-align:center;
        }

        .container{
            width:700px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#481515;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
            color:#481515;
        }

        input,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:15px;
        }

        textarea{
            height:120px;
            resize:none;
        }

        button{
            margin-top:25px;
            width:100%;
            padding:14px;
            background:#b18a55;
            color:white;
            border:none;
            border-radius:6px;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#c69e67;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            color:#481515;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>
<body>

<header>
    <h2>Адмін-панель</h2>
</header>

<div class="container">

    <h1>Додати нову позицію</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>Назва</label>
        <input type="text" name="name" required>

        <label>Фото</label>
        <input type="file" name="photo" required>

        <label>Опис</label>
        <textarea name="description" required></textarea>

        <label>Інгредієнти</label>
        <textarea name="ingredients" required></textarea>

        <label>Ціна</label>
        <input type="number" step="0.01" name="price" required>

        <label>Вага (г)</label>
        <input type="number" name="weight" required>

        <button type="submit">
            Додати позицію
        </button>

    </form>

    <a href="/menu" class="back">
        ← Повернутися до меню
    </a>

</div>

</body>
</html>

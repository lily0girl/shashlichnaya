<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Бронювання — Шашличний Рай</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5efe6;
        }

        .navbar {
            background-color: #481515;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .reservation {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #481515;
        }

        .btn-main {
            background-color: #481515;
            color: white;
            width: 100%;
        }

        .btn-main:hover {
            background-color: #6b2222;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand" href="/">
            Шашличний Рай
        </a>

        <div>

            <a class="nav-link d-inline-block" href="/">
                Головна
            </a>

            <a class="nav-link d-inline-block" href="/menu">
                Меню
            </a>

            <a class="nav-link d-inline-block" href="/cart">
                🛒 Кошик
            </a>

            <a class="nav-link d-inline-block" href="/orders">
                Замовлення
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="reservation shadow-sm">

        <h1 class="text-center mb-4">
            Бронювання столика
        </h1>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Дата
                </label>

                <input
                    type="date"
                    name="date"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Час
                </label>

                <input
                    type="time"
                    name="time"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Кількість гостей
                </label>

                <input
                    type="number"
                    name="guests"
                    class="form-control"
                    min="1"
                    max="20"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-main"
            >
                Забронювати столик
            </button>

        </form>

    </div>

</div>

</body>

</html>

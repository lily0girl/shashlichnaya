<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Меню — Шашличний Рай</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5efe6;
        }

        .navbar {
            background-color: #481515;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        h1 {
            color: #481515;
        }

        .card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
        }

        .card img {
            height: 220px;
            object-fit: cover;
        }

        .price {
            color: #481515;
            font-size: 20px;
            font-weight: bold;
        }

        .btn-menu {
            background-color: #481515;
            color: white;
        }

        .btn-menu:hover {
            background-color: #6b2222;
            color: white;
        }

        .btn-cart {
            background-color: #d6a84f;
            color: white;
        }

        .btn-cart:hover {
            background-color: #b88d35;
            color: white;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand" href="/">
            Шашличний Рай
        </a>

        <div>

            <a class="nav-link d-inline-block" href="/">
                Головна
            </a>

            <a class="nav-link d-inline-block" href="/menu">
                Меню
            </a>

            <a class="btn btn-cart ms-2" href="/cart">
                🛒 Кошик
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <h1 class="text-center mb-5">
        Наше меню
    </h1>

    <div class="row">

        {% for dish in dishes %}

        <div class="col-md-4 mb-4">

            <div class="card shadow-sm">

                <img
                    src="{{ dish.photo }}"
                    class="card-img-top"
                    alt="{{ dish.name }}"
                >

                <div class="card-body">

                    <h4 class="card-title">
                        {{ dish.name }}
                    </h4>

                    <p class="card-text">
                        {{ dish.description }}
                    </p>

                    <p class="price">
                        {{ dish.price }} €
                    </p>

                    <a
                        href="/position/{{ dish.id }}"
                        class="btn btn-menu"
                    >
                        Детальніше
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>

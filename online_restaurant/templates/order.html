<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Замовлення №{{ order.id }} — Шашличний Рай</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5efe6;
        }

        .navbar {
            background-color: #481515;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .order {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
        }

        h1 {
            color: #481515;
        }

        .price {
            color: #481515;
            font-size: 24px;
            font-weight: bold;
        }

        .btn-main {
            background-color: #481515;
            color: white;
        }

        .btn-main:hover {
            background-color: #6b2222;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand" href="/">
            Шашличний Рай
        </a>

        <div>

            <a class="nav-link d-inline-block" href="/">
                Головна
            </a>

            <a class="nav-link d-inline-block" href="/menu">
                Меню
            </a>

            <a class="nav-link d-inline-block" href="/cart">
                🛒 Кошик
            </a>

            <a class="nav-link d-inline-block" href="/orders">
                Замовлення
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="order shadow-sm">

        <h1 class="mb-4">
            Замовлення №{{ order.id }}
        </h1>

        <p>
            <b>Страва:</b>
            {{ order.dish_name }}
        </p>

        <p>
            <b>Кількість:</b>
            {{ order.quantity }}
        </p>

        <p class="price">
            Загальна сума: {{ order.total_price }} €
        </p>

        <hr>

        <p>
            Дякуємо за ваше замовлення!
        </p>

        <a
            href="/orders"
            class="btn btn-main"
        >
            Повернутися до замовлень
        </a>

        <a
            href="/cancel_order/{{ order.id }}"
            class="btn btn-danger"
        >
            Скасувати замовлення
        </a>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ dish.name }} — Шашличний Рай</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5efe6;
        }

        .navbar {
            background-color: #481515;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .dish {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
        }

        .dish img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 10px;
        }

        h1 {
            color: #481515;
        }

        .price {
            color: #481515;
            font-size: 25px;
            font-weight: bold;
        }

        .btn-cart {
            background-color: #481515;
            color: white;
            padding: 12px 25px;
        }

        .btn-cart:hover {
            background-color: #6b2222;
            color: white;
        }

        .btn-shopping {
            background-color: #d6a84f;
            color: white;
        }

        .btn-shopping:hover {
            background-color: #b88d35;
            color: white;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand" href="/">
            Шашличний Рай
        </a>

        <div>

            <a class="nav-link d-inline-block" href="/">
                Головна
            </a>

            <a class="nav-link d-inline-block" href="/menu">
                Меню
            </a>

            <a class="btn btn-shopping ms-2" href="/cart">
                🛒 Кошик
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="dish shadow-sm">

        <div class="row">

            <div class="col-md-6">

                <img
                    src="{{ dish.photo }}"
                    alt="{{ dish.name }}"
                >

            </div>

            <div class="col-md-6">

                <h1 class="mb-4">
                    {{ dish.name }}
                </h1>

                <p>
                    <b>Опис:</b>
                </p>

                <p>
                    {{ dish.description }}
                </p>

                <p>
                    <b>Інгредієнти:</b>
                </p>

                <p>
                    {{ dish.ingredients }}
                </p>

                <p>
                    <b>Вага:</b>
                    {{ dish.weight }} г
                </p>

                <p class="price">
                    {{ dish.price }} €
                </p>

                <a
                    href="/add_to_cart/{{ dish.id }}"
                    class="btn btn-cart"
                >
                    Додати у кошик
                </a>

                <a
                    href="/menu"
                    class="btn btn-secondary ms-2"
                >
                    Назад до меню
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
